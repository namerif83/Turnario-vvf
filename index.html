<!doctype html><html lang='it'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#b30000'><link rel='manifest' href='manifest.json'><link rel='apple-touch-icon' href='icon.svg'><title>Turnario VVF</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b1b1b;background:#f3f4f6}body{margin:0}header{background:#b30000;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}.sub{font-size:13px;opacity:.9}.wrap{padding:12px;max-width:760px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:0;border-radius:12px;padding:12px;font-weight:700;background:#b30000;color:#fff}.btn.alt{background:#eee;color:#222}.btn.ok{background:#167c3a}.btn.warn{background:#cc7a00}input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:10px;background:#fff}label{display:block;font-size:12px;margin:8px 0 4px;color:#555}.stat{font-size:24px;font-weight:800}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.small{font-size:12px;color:#666}.pill{padding:5px 8px;border-radius:999px;background:#eee;font-size:12px}.hidden{display:none}.day{border-bottom:1px solid #eee;padding:10px 0}.danger{color:#a00000}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;bottom:0;background:#f3f4f6;padding:8px}.tabs button{padding:10px 4px;border:0;border-radius:10px;background:#ddd}.tabs button.active{background:#b30000;color:#fff}
</style></head><body><header><h1>Turnario VVF</h1><div class='sub' id='todayLabel'></div></header><main class='wrap'>
<section id='home' class='page'><div class='card'><div class='row'><div><div class='small'>Servizio di oggi</div><div id='todayShift' class='stat'>—</div></div><span id='gpsState' class='pill'>Sede non impostata</span></div><div id='nextReminder' class='small' style='margin-top:8px'></div></div>
<div class='grid'><button class='btn ok' onclick='confirmStamp("entrata")'>Ho timbrato entrata</button><button class='btn ok' onclick='confirmStamp("uscita")'>Ho timbrato uscita</button><button class='btn warn' onclick='setIntervention(true)'>Sono fuori per intervento</button><button class='btn alt' onclick='setIntervention(false)'>Sono rientrato</button></div>
<div class='card'><h3>Residui</h3><div class='grid'><div><div class='small'>Ferie</div><div class='stat' id='vacLeft'>0</div></div><div><div class='small'>Congedo 100%</div><div class='stat' id='p100Left'>0</div></div><div><div class='small'>Congedo 80%</div><div class='stat' id='p80Left'>0</div></div><div><div class='small'>Buoni mancanti</div><div class='stat' id='mealMissing'>0</div></div></div></div></section>
<section id='calendar' class='page hidden'><div class='card'><h3>Aggiungi giornata</h3><label>Data</label><input type='date' id='entryDate'><label>Tipo</label><select id='entryType'><option>Ferie</option><option>Congedo 100%</option><option>Congedo 80%</option><option>Vigilanza</option><option>Salto turno</option><option>Turno diurno</option><option>Turno notturno</option><option>Riposo</option></select><label>Note</label><input id='entryNote' placeholder='Facoltativo'><button class='btn' style='margin-top:10px;width:100%' onclick='addEntry()'>Salva</button></div><div class='card'><h3>Prossimi giorni</h3><div id='daysList'></div></div></section>
<section id='counts' class='page hidden'><div class='card'><h3>Disponibilità iniziali</h3><label>Ferie</label><input type='number' id='vacTotal'><label>Congedo parentale 100%</label><input type='number' id='p100Total'><label>Congedo parentale 80%</label><input type='number' id='p80Total'><button class='btn' style='margin-top:10px;width:100%' onclick='saveTotals()'>Aggiorna residui</button></div><div class='card'><h3>Buoni pasto</h3><div class='grid'><button class='btn alt' onclick='meal("maturato")'>+ Maturato</button><button class='btn alt' onclick='meal("ricevuto")'>+ Ricevuto</button></div><p class='small' id='mealSummary'></p></div><div class='card'><h3>Vigilanze</h3><label>Data</label><input type='date' id='vigDate'><label>Ore</label><input type='number' id='vigHours' step='0.5'><label>Note</label><input id='vigNote'><button class='btn' style='margin-top:10px;width:100%' onclick='addVigilanza()'>Aggiungi vigilanza</button><div id='vigList'></div></div></section>
<section id='settings' class='page hidden'><div class='card'><h3>Turnario perpetuo</h3><label>Turno di appartenenza</label><select id='team'><option>A</option><option>B</option><option>C</option><option>D</option></select><label>Data di riferimento del turno diurno</label><input type='date' id='anchor'><label>Frequenza salto turno (giorni)</label><input type='number' id='skipEvery' value='28'><label>Prima data salto turno</label><input type='date' id='skipAnchor'><button class='btn' style='margin-top:10px;width:100%' onclick='saveSettings()'>Salva turnario</button></div><div class='card'><h3>Sede GPS</h3><p class='small'>Raggio fisso: 200 metri.</p><button class='btn' style='width:100%' onclick='saveCurrentLocation()'>Imposta questa posizione come sede</button><p class='small' id='coords'></p></div><div class='card'><h3>Backup</h3><div class='grid'><button class='btn alt' onclick='exportData()'>Esporta backup</button><label class='btn alt' style='text-align:center'>Importa<input type='file' accept='application/json' onchange='importData(event)' style='display:none'></label></div></div></section>
</main><nav class='tabs'><button class='active' onclick='showPage("home",this)'>Oggi</button><button onclick='showPage("calendar",this)'>Calendario</button><button onclick='showPage("counts",this)'>Contatori</button><button onclick='showPage("settings",this)'>Impostazioni</button></nav>
<script>
const KEY='turnarioVVF_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{settings:{team:'A',anchor:new Date().toISOString().slice(0,10),skipEvery:28,skipAnchor:'',radius:200},totals:{vac:0,p100:0,p80:0},entries:[],meals:{maturato:0,ricevuto:0},vig:[],stamps:[],intervention:false};
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit'})}
function dayDiff(a,b){return Math.floor((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function baseShift(date){let n=((dayDiff(db.settings.anchor,date)%4)+4)%4;return ['Diurno','Riposo','Notturno','Smontante'][n]}
function isSkip(date){if(!db.settings.skipAnchor||!db.settings.skipEvery)return false;let d=dayDiff(db.settings.skipAnchor,date);return d>=0&&d%db.settings.skipEvery===0}
function effective(date){let manual=db.entries.filter(e=>e.date===date).slice(-1)[0];if(manual)return manual.type;return isSkip(date)?'Salto turno':baseShift(date)}
function used(type){return db.entries.filter(e=>e.type===type).length}
function render(){let t=new Date().toISOString().slice(0,10);todayLabel.textContent=new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});todayShift.textContent=effective(t);gpsState.textContent=db.settings.lat?'Sede GPS attiva':'Sede non impostata';coords.textContent=db.settings.lat?`Lat ${db.settings.lat.toFixed(5)} · Lon ${db.settings.lon.toFixed(5)} · raggio 200 m`:'';vacLeft.textContent=db.totals.vac-used('Ferie');p100Left.textContent=db.totals.p100-used('Congedo 100%');p80Left.textContent=db.totals.p80-used('Congedo 80%');mealMissing.textContent=db.meals.maturato-db.meals.ricevuto;mealSummary.textContent=`Maturati ${db.meals.maturato} · Ricevuti ${db.meals.ricevuto} · Mancanti ${db.meals.maturato-db.meals.ricevuto}`;vacTotal.value=db.totals.vac;p100Total.value=db.totals.p100;p80Total.value=db.totals.p80;team.value=db.settings.team;anchor.value=db.settings.anchor;skipEvery.value=db.settings.skipEvery;skipAnchor.value=db.settings.skipAnchor||'';let h='';for(let i=0;i<21;i++){let d=new Date();d.setDate(d.getDate()+i);let ds=d.toISOString().slice(0,10);h+=`<div class='day row'><div><b>${fmt(ds)}</b><div class='small'>${effective(ds)}</div></div><button class='btn alt' onclick='quickEdit("${ds}")'>Modifica</button></div>`}daysList.innerHTML=h;vigList.innerHTML=db.vig.map(v=>`<div class='day'><b>${fmt(v.date)}</b> · ${v.hours} ore<div class='small'>${v.note||''}</div></div>`).join('');scheduleHint()}
function scheduleHint(){let s=effective(new Date().toISOString().slice(0,10));let txt=s==='Diurno'?'Promemoria: 07:30 entrata · 20:01 uscita':s==='Notturno'?'Promemoria: 19:30 entrata · 08:01 uscita domani':'Nessun promemoria di timbratura previsto';nextReminder.textContent=txt+(db.intervention?' · Intervento in corso':'')}
function showPage(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function addEntry(){if(!entryDate.value)return alert('Inserisci la data');db.entries.push({date:entryDate.value,type:entryType.value,note:entryNote.value});save();entryNote.value=''}
function quickEdit(d){entryDate.value=d;showPage('calendar',document.querySelectorAll('.tabs button')[1]);window.scrollTo(0,0)}
function saveTotals(){db.totals={vac:+vacTotal.value||0,p100:+p100Total.value||0,p80:+p80Total.value||0};save()}
function meal(k){db.meals[k]++;save()}
function addVigilanza(){if(!vigDate.value)return alert('Inserisci la data');db.vig.push({date:vigDate.value,hours:+vigHours.value||0,note:vigNote.value});save();vigHours.value='';vigNote.value=''}
function saveSettings(){db.settings.team=team.value;db.settings.anchor=anchor.value;db.settings.skipEvery=+skipEvery.value||28;db.settings.skipAnchor=skipAnchor.value;save()}
function confirmStamp(kind){db.stamps.push({kind,at:new Date().toISOString()});if(kind==='uscita')db.intervention=false;save();alert(`Timbratura ${kind} confermata`)}
function setIntervention(v){db.intervention=v;save();if(v)startGeoWatch()}
function saveCurrentLocation(){if(!navigator.geolocation)return alert('GPS non disponibile');navigator.geolocation.getCurrentPosition(p=>{db.settings.lat=p.coords.latitude;db.settings.lon=p.coords.longitude;db.settings.radius=200;save();alert('Sede aggiornata con raggio di 200 metri')},e=>alert('Posizione non disponibile: '+e.message),{enableHighAccuracy:true})}
function dist(a,b,c,d){const R=6371000,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,A=Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(A))}
let watchId=null;function startGeoWatch(){if(!db.settings.lat||!navigator.geolocation)return;if(watchId)navigator.geolocation.clearWatch(watchId);watchId=navigator.geolocation.watchPosition(p=>{let m=dist(p.coords.latitude,p.coords.longitude,db.settings.lat,db.settings.lon);if(db.intervention&&m<=200){notify('Rientro in sede','Ricordati di timbrare l’uscita');}},()=>{}, {enableHighAccuracy:false,maximumAge:60000})}
async function notify(title,body){if('Notification'in window){if(Notification.permission==='default')await Notification.requestPermission();if(Notification.permission==='granted'&&navigator.serviceWorker){let r=await navigator.serviceWorker.ready;r.showNotification(title,{body,tag:'timbratura-uscita',renotify:true})}}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-turnario-vvf.json';a.click()}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save()}catch{alert('Backup non valido')}};r.readAsText(f)}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();if(db.intervention)startGeoWatch();
</script></body></html>
